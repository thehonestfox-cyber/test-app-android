name: Aggiorna eventi
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eventi
  cancel-in-progress: false
jobs:
  eventi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leggi i siti e scrivi eventi.json
        run: python scripts/aggiorna_eventi.py
      - name: Commit se è cambiato
        run: |
          git config user.name "eventi-bot"
          git config user.email "eventi-bot@users.noreply.github.com"
          git add eventi.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna eventi"
            git pull --rebase origin main
            git push
          fi
