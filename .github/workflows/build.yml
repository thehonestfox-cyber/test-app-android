name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Compila APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            grep -E "^e:|error:|What went wrong" -A 2 build.log | head -n 9 | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit 1
          fi
      - name: Pubblica release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk pez8.apk
          gh release create "build-${{ github.run_number }}" pez8.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "${{ github.event.head_commit.message }}" \
            --latest
